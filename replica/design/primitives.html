<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design primitives</title>
<link rel="stylesheet" href="tokens.css">
<script>
  window.MathJax = {
    loader: { load: ['[tex]/mhchem', '[tex]/color', '[tex]/bbox'] },
    tex: { packages: { '[+]': ['mhchem', 'color', 'bbox'] } },
    svg: { fontCache: 'none' }
  };
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-svg.js"></script>
<style>
  /* Static preview of the components in components.md, using only --lx-*
     tokens. The real primitives are React + Radix in /replica-build. */
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--lx-color-bg); color: var(--lx-color-text);
         font: 400 var(--lx-text-sm)/var(--lx-leading-sm) var(--lx-font-sans); }
  .themes { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 1100px) { .themes { grid-template-columns: 1fr 1fr; } }
  .theme { padding: var(--lx-space-5); background: var(--lx-color-bg); color: var(--lx-color-text); min-width: 0; }
  h1 { font-size: var(--lx-text-xl); line-height: var(--lx-leading-xl); margin: 0 0 var(--lx-space-2); }
  h2 { font-size: var(--lx-text-xs); line-height: var(--lx-leading-xs); font-weight: 600; text-transform: uppercase;
       letter-spacing: .06em; color: var(--lx-color-text-muted); margin: var(--lx-space-6) 0 var(--lx-space-3); }
  .row { display: flex; flex-wrap: wrap; gap: var(--lx-space-2); align-items: center; }
  .muted { color: var(--lx-color-text-muted); }

  .btn { height: 40px; padding: 0 var(--lx-space-4); border-radius: var(--lx-radius-md); border: 1px solid transparent;
         font: 600 var(--lx-text-sm)/1 var(--lx-font-sans); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
         transition: background var(--lx-motion-fast) var(--lx-ease); }
  .btn:focus-visible, .key:focus-visible, .field input:focus-visible, .card:focus-visible {
         outline: var(--lx-ring-width) solid var(--lx-color-focus); outline-offset: var(--lx-ring-offset); }
  .primary { background: var(--lx-color-accent); color: var(--lx-color-on-accent); }
  .primary:hover, .primary.hover { background: var(--lx-color-accent-hover); }
  .secondary { background: var(--lx-color-surface); color: var(--lx-color-text); border-color: var(--lx-color-border); }
  .secondary:hover, .secondary.hover { background: var(--lx-color-surface-2); }
  .ghost { background: transparent; color: var(--lx-color-text); }
  .ghost:hover { background: var(--lx-color-surface-2); }
  .danger { background: var(--lx-color-danger); color: var(--lx-color-on-accent); }
  .btn[disabled] { opacity: .4; cursor: not-allowed; }
  .sm { height: 32px; padding: 0 var(--lx-space-3); }
  .focus { outline: var(--lx-ring-width) solid var(--lx-color-focus); outline-offset: var(--lx-ring-offset); }
  .spin { width: 14px; height: 14px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; }

  .key { width: var(--lx-key); height: var(--lx-key); border-radius: var(--lx-radius-sm); border: 0; background: var(--lx-color-surface);
         color: var(--lx-color-text); display: inline-grid; place-items: center; cursor: pointer; font-size: 15px; padding: 0; }
  .key:hover, .key.hover { background: var(--lx-color-surface-2); }
  .key.active { background: var(--lx-color-accent-soft); color: var(--lx-color-accent); }
  .key.text { width: auto; padding: 0 var(--lx-space-2); font: 500 var(--lx-text-xs)/1 var(--lx-font-sans); }
  .tabs { display: flex; gap: var(--lx-space-1); border-bottom: 1px solid var(--lx-color-border); margin-bottom: var(--lx-space-2); overflow-x: auto; }
  .tab { padding: var(--lx-space-2) var(--lx-space-3); color: var(--lx-color-text-muted); font-weight: 500; border-bottom: 2px solid transparent; white-space: nowrap; }
  .tab.on { color: var(--lx-color-text); border-color: var(--lx-color-accent); }

  .editor { font: var(--lx-text-code)/var(--lx-leading-code) var(--lx-font-mono); background: var(--lx-color-bg);
            border: 1px solid var(--lx-color-border-input); border-radius: var(--lx-radius-md); padding: var(--lx-space-3); min-height: 72px; }
  .editor.focused { border-color: var(--lx-color-accent); outline: var(--lx-ring-width) solid var(--lx-color-focus); outline-offset: var(--lx-ring-offset); }
  .cmd { color: var(--lx-color-accent); } .brace { color: var(--lx-color-text-muted); }
  .err-line { text-decoration: wavy underline var(--lx-color-danger); }

  .preview { background: var(--lx-color-surface); border: 1px solid var(--lx-color-border); border-radius: var(--lx-radius-lg);
             padding: var(--lx-space-5); text-align: center; font-size: var(--lx-math-size); min-height: 80px; overflow-x: auto; }
  .preview.stale mjx-container { opacity: .4; }

  .callout { display: flex; gap: var(--lx-space-2); border-radius: var(--lx-radius-md); padding: var(--lx-space-3) var(--lx-space-4); margin-top: var(--lx-space-2); text-align: left; font-size: var(--lx-text-sm); }
  .c-info { background: var(--lx-color-accent-soft); color: var(--lx-color-accent); }
  .c-success { background: var(--lx-color-success-soft); color: var(--lx-color-success); }
  .c-warning { background: var(--lx-color-warning-soft); color: var(--lx-color-warning); }
  .c-danger { background: var(--lx-color-danger-soft); color: var(--lx-color-danger); }

  .field { display: grid; gap: var(--lx-space-1); }
  .field label { font-weight: 500; }
  .field input { height: 40px; padding: 0 var(--lx-space-3); border: 1px solid var(--lx-color-border-input); border-radius: var(--lx-radius-md);
                 background: var(--lx-color-bg); color: var(--lx-color-text); font: inherit; }
  .field.invalid input { border-color: var(--lx-color-danger); }
  .field .hint { font-size: var(--lx-text-xs); color: var(--lx-color-text-muted); }
  .field.invalid .hint { color: var(--lx-color-danger); }
  .num { width: 72px; height: 32px !important; }

  .switch { display: inline-flex; align-items: center; gap: var(--lx-space-2); }
  .track { width: 36px; height: 20px; border-radius: var(--lx-radius-pill); border: 1px solid var(--lx-color-border-input); position: relative; background: var(--lx-color-bg); }
  .track::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--lx-color-border-input); }
  .track.on { background: var(--lx-color-accent); border-color: var(--lx-color-accent); }
  .track.on::after { left: 18px; background: var(--lx-color-on-accent); }

  .dialog { background: var(--lx-color-bg); border-radius: var(--lx-radius-lg); box-shadow: var(--lx-shadow-pop); border: 1px solid var(--lx-color-border); max-width: 460px; }
  .backdrop { background: var(--lx-color-overlay); padding: var(--lx-space-5); border-radius: var(--lx-radius-lg); }
  .d-head { display: flex; justify-content: space-between; align-items: center; padding: var(--lx-space-4) var(--lx-space-5); border-bottom: 1px solid var(--lx-color-border); }
  .d-head b { font-size: var(--lx-text-lg); }
  .d-body { padding: var(--lx-space-5); }
  .d-foot { display: flex; justify-content: flex-end; gap: var(--lx-space-2); padding: var(--lx-space-3) var(--lx-space-5); border-top: 1px solid var(--lx-color-border); }
  .cards { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--lx-space-2); }
  .card { border: 1px solid var(--lx-color-border); border-radius: var(--lx-radius-md); padding: var(--lx-space-2); text-align: center; background: var(--lx-color-bg); color: var(--lx-color-text); cursor: pointer; font-size: 13px; }
  .card.sel { border: 2px solid var(--lx-color-accent); background: var(--lx-color-accent-soft); }

  .snips { list-style: none; margin: 0; padding: 0; border: 1px solid var(--lx-color-border); border-radius: var(--lx-radius-md); background: var(--lx-color-surface); width: 280px; }
  .snip { display: grid; grid-template-columns: 1fr auto; gap: 2px var(--lx-space-2); padding: var(--lx-space-2) var(--lx-space-3); border-bottom: 1px solid var(--lx-color-border); }
  .snip:last-child { border-bottom: 0; }
  .snip.current { background: var(--lx-color-accent-soft); box-shadow: inset 3px 0 0 var(--lx-color-accent); }
  .snip code { font: var(--lx-text-xs)/var(--lx-leading-xs) var(--lx-font-mono); grid-column: 1 / -1; color: var(--lx-color-text-muted); }
  .snip small { color: var(--lx-color-text-muted); font-size: var(--lx-text-xs); }
  .skel { height: 14px; border-radius: var(--lx-radius-sm); background: var(--lx-color-surface-2); margin: 6px 0; }
  .tooltip { display: inline-block; background: var(--lx-color-text); color: var(--lx-color-bg); font-size: var(--lx-text-xs); padding: 4px 8px; border-radius: var(--lx-radius-sm); }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; border: 1px solid var(--lx-color-border); vertical-align: middle; }
  table { border-collapse: collapse; font-size: var(--lx-text-xs); }
  td, th { padding: 4px 8px; border-bottom: 1px solid var(--lx-color-border); text-align: left; }
</style>
</head>
<body>
<div class="themes">
  <section class="theme" id="light"></section>
  <section class="theme" id="dark"></section>
</div>

<template id="kit">
  <h1>Primitives <span class="muted" style="font-size:14px;font-weight:400" data-label></span></h1>
  <p class="muted">Every component in components.md, in its states, using tokens only.</p>

  <h2>Buttons</h2>
  <div class="row">
    <button class="btn primary">Download PNG</button>
    <button class="btn primary hover">Hover</button>
    <button class="btn primary focus">Focus</button>
    <button class="btn primary" disabled>Disabled</button>
    <button class="btn primary" aria-busy="true"><span class="spin"></span>Exporting…</button>
  </div>
  <div class="row" style="margin-top:8px">
    <button class="btn secondary">Copy LaTeX</button>
    <button class="btn secondary hover">Hover</button>
    <button class="btn ghost">↶ Undo</button>
    <button class="btn ghost" disabled>↷ Redo</button>
    <button class="btn danger sm">Delete</button>
    <span class="tooltip">Undo · Ctrl+Z</span>
  </div>

  <h2>Palette</h2>
  <div class="tabs"><span class="tab on">Basics</span><span class="tab">Relations</span><span class="tab">Arrows</span><span class="tab">Greek</span><span class="tab">Sets</span><span class="tab">Functions</span><span class="tab">Style</span></div>
  <div class="row" style="gap:4px">
    <button class="key" aria-label="superscript">\(x^n\)</button>
    <button class="key" aria-label="subscript">\(x_n\)</button>
    <button class="key hover" aria-label="fraction">\(\frac ab\)</button>
    <button class="key active" aria-label="square root">\(\sqrt x\)</button>
    <button class="key focus" aria-label="sum">\(\sum\)</button>
    <button class="key" aria-label="integral">\(\int\)</button>
    <button class="key" aria-label="alpha">\(\alpha\)</button>
    <button class="key" aria-label="not equal">\(\neq\)</button>
    <button class="key" aria-label="implies">\(\Rightarrow\)</button>
    <button class="key" disabled style="opacity:.4" aria-label="infinity">\(\infty\)</button>
    <button class="key text">Text</button>
    <button class="key text">Bold</button>
    <button class="key text">Display</button>
  </div>

  <h2>Editor and preview</h2>
  <div class="editor focused"><span class="cmd">\int</span>_0^1 x^2 <span class="cmd">\,</span> dx = <span class="cmd">\frac</span><span class="brace">{</span>1<span class="brace">}{</span>3<span class="brace">}</span></div>
  <div class="preview" style="margin-top:8px">\[\int_0^1 x^2\,dx = \frac{1}{3}\]</div>
  <div class="editor" style="margin-top:16px"><span class="err-line"><span class="cmd">\frac</span><span class="brace">{</span>1<span class="brace">}{</span></span></div>
  <div class="preview stale" style="margin-top:8px">\[\frac{1}{3}\]
    <div class="callout c-danger" role="alert">⚠ Missing close brace on line 1. Showing the last equation that worked.</div>
  </div>
  <div class="preview muted" style="margin-top:8px;font-size:14px;display:grid;place-items:center">Your equation appears here</div>

  <h2>Controls</h2>
  <div class="row" style="gap:24px;align-items:flex-start">
    <div class="field"><label>Size</label><input class="num" type="number" value="20"></div>
    <div class="field invalid"><label>Size</label><input class="num" type="number" value="200"><span class="hint">8 to 96</span></div>
    <span class="switch" style="margin-top:28px"><span class="track"></span>Raster preview</span>
    <span class="switch" style="margin-top:28px"><span class="track on"></span>Raster preview</span>
  </div>

  <h2>Callouts</h2>
  <div class="callout c-info">ℹ Saved in this browser. Sign in to keep them on every device.</div>
  <div class="callout c-success">✓ Check your inbox to confirm your email.</div>
  <div class="callout c-warning">! PNG too large for this device, exported at 2×.</div>

  <h2>Dialog: matrix builder</h2>
  <div class="backdrop">
    <div class="dialog" role="dialog" aria-label="Insert matrix">
      <div class="d-head"><b>Insert matrix</b><button class="btn ghost sm" aria-label="Close">✕</button></div>
      <div class="d-body">
        <div class="cards">
          <div class="card" tabindex="0">\(\begin{matrix}a&b\\c&d\end{matrix}\)</div>
          <div class="card sel" tabindex="0">\(\begin{pmatrix}a&b\\c&d\end{pmatrix}\)</div>
          <div class="card" tabindex="0">\(\begin{bmatrix}a&b\\c&d\end{bmatrix}\)</div>
          <div class="card" tabindex="0">\(\begin{vmatrix}a&b\\c&d\end{vmatrix}\)</div>
          <div class="card" tabindex="0">\(\begin{Vmatrix}a&b\\c&d\end{Vmatrix}\)</div>
          <div class="card" tabindex="0">\(\begin{Bmatrix}a&b\\c&d\end{Bmatrix}\)</div>
        </div>
        <div class="row" style="margin-top:16px;gap:16px">
          <div class="field"><label>Rows</label><input class="num" type="number" value="3"></div>
          <div class="field"><label>Columns</label><input class="num" type="number" value="3"></div>
        </div>
      </div>
      <div class="d-foot"><button class="btn secondary sm">Cancel</button><button class="btn primary sm">Insert</button></div>
    </div>
  </div>

  <h2>Reference sheet row and colour table</h2>
  <div class="row" style="align-items:flex-start;gap:24px">
    <button class="btn secondary" style="height:auto;padding:8px 12px;gap:16px"><code style="color:var(--lx-color-accent);font-family:var(--lx-font-mono)">\ce{2H2 + O2 -&gt; 2H2O}</code><span>\(\ce{2H2 + O2 -> 2H2O}\)</span></button>
    <table><thead><tr><th>Name</th><th>Hex</th><th></th></tr></thead>
      <tbody><tr><td>Teal</td><td>#008080</td><td><span class="swatch" style="background:#008080"></span></td></tr>
      <tr><td>Orchid</td><td>#DA70D6</td><td><span class="swatch" style="background:#DA70D6"></span></td></tr></tbody></table>
  </div>

  <h2>Saved equations</h2>
  <div class="row" style="align-items:flex-start;gap:24px">
    <ul class="snips">
      <li class="snip current"><span>Gaussian integral</span><small>2 min ago</small><code>\int_{-\infty}^{\infty} e^{-x^2}…</code></li>
      <li class="snip"><span>Euler's identity</span><small>yesterday</small><code>e^{i\pi} + 1 = 0</code></li>
      <li class="snip"><span class="muted">Untitled</span><small>3 days ago</small><code>\ce{CO2 + H2O}</code></li>
    </ul>
    <ul class="snips" aria-busy="true" style="width:160px;padding:8px 12px"><li><div class="skel"></div><div class="skel" style="width:60%"></div><div class="skel"></div></li></ul>
    <p class="muted" style="max-width:200px;margin:0">No saved equations yet. Press Save to keep the one you're working on.</p>
  </div>
</template>

<script>
  // Fill both columns from the template, then pin each column to one theme
  // by setting the token values on it (the same values as tokens.css).
  const light = {
    'color-scheme': 'light',
    '--lx-color-bg': '#ffffff', '--lx-color-surface': '#f5f6f8', '--lx-color-surface-2': '#eceef2',
    '--lx-color-border': '#e2e5ea', '--lx-color-border-input': '#858d99', '--lx-color-text': '#15181d',
    '--lx-color-text-muted': '#5a6371', '--lx-color-accent': '#0f766e', '--lx-color-accent-hover': '#115e59',
    '--lx-color-accent-soft': '#ccfbf1', '--lx-color-on-accent': '#ffffff', '--lx-color-focus': '#0f766e',
    '--lx-color-danger': '#c22d2d', '--lx-color-danger-soft': '#fdeeee', '--lx-color-success': '#3f6212',
    '--lx-color-success-soft': '#ecfccb', '--lx-color-warning': '#8a5800', '--lx-color-warning-soft': '#fff5e0',
    '--lx-color-overlay': 'rgba(10,12,16,.45)', '--lx-shadow-pop': '0 12px 32px rgba(16,24,40,.18)'
  };
  const dark = {
    'color-scheme': 'dark',
    '--lx-color-bg': '#0f1115', '--lx-color-surface': '#171a20', '--lx-color-surface-2': '#20242c',
    '--lx-color-border': '#2a2f38', '--lx-color-border-input': '#6f7784', '--lx-color-text': '#e8eaee',
    '--lx-color-text-muted': '#9ba4b1', '--lx-color-accent': '#2dd4bf', '--lx-color-accent-hover': '#5eead4',
    '--lx-color-accent-soft': '#0d2b29', '--lx-color-on-accent': '#042f2a', '--lx-color-focus': '#2dd4bf',
    '--lx-color-danger': '#ff8080', '--lx-color-danger-soft': '#2b1517', '--lx-color-success': '#a3e635',
    '--lx-color-success-soft': '#1c2a0b', '--lx-color-warning': '#f0b44c', '--lx-color-warning-soft': '#2a2011',
    '--lx-color-overlay': 'rgba(0,0,0,.6)', '--lx-shadow-pop': '0 12px 32px rgba(0,0,0,.5)'
  };
  for (const [id, vars] of [['light', light], ['dark', dark]]) {
    const el = document.getElementById(id);
    el.append(document.getElementById('kit').content.cloneNode(true));
    el.querySelector('[data-label]').textContent = id + ' theme';
    for (const [k, v] of Object.entries(vars)) el.style.setProperty(k, v);
  }
</script>
</body>
</html>
